name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

jobs:
  validate-skills:
    name: Validate StoryCraft Skills
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate SKILL.md Files
        run: node bin/storycraft.mjs test

      - name: Validate Multiplatform Sync
        run: node bin/storycraft.mjs sync --target all

      - name: Verify Git Cleanliness (Pre-compiled dist check)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Pre-compiled dist files are out of sync with skills/. Run 'node bin/storycraft.mjs sync --target all' and commit."
            exit 1
          fi
