name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate StoryCraft Skills
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate SKILL.md Files & Craft Standards
        run: npm test

  security-scan:
    name: Security Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Zero Dependencies
        run: |
          if [ -d "node_modules" ]; then
            echo "FAIL: node_modules directory should not exist"
            exit 1
          fi
          if grep -q '"dependencies"' package.json; then
            DEPS=$(node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log(Object.keys(p.dependencies||{}).length)")
            if [ "$DEPS" != "0" ]; then
              echo "FAIL: package.json must have zero dependencies (found $DEPS)"
              exit 1
            fi
          fi
          echo "PASS: Zero external dependencies confirmed"

      - name: Scan for Network Calls
        run: |
          HITS=$(grep -rn --include='*.js' --include='*.mjs' --include='*.sh' \
            -E '(fetch\(|XMLHttpRequest|WebSocket|\.ajax\(|http\.request|https\.request|net\.connect|dgram\.)' \
            . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "FAIL: Found $HITS network call patterns"
            grep -rn --include='*.js' --include='*.mjs' --include='*.sh' \
              -E '(fetch\(|XMLHttpRequest|WebSocket|\.ajax\(|http\.request|https\.request|net\.connect|dgram\.)' \
              . --exclude-dir=.git --exclude-dir=node_modules
            exit 1
          fi
          echo "PASS: Zero network calls detected"

      - name: Scan for Code Execution Vectors
        run: |
          HITS=$(grep -rn --include='*.js' --include='*.mjs' \
            -E '(eval\(|new Function\(|child_process|\.exec\(|\.spawn\(|vm\.run)' \
            . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "FAIL: Found $HITS code execution patterns"
            grep -rn --include='*.js' --include='*.mjs' \
              -E '(eval\(|new Function\(|child_process|\.exec\(|\.spawn\(|vm\.run)' \
              . --exclude-dir=.git --exclude-dir=node_modules
            exit 1
          fi
          echo "PASS: Zero code execution vectors detected"

      - name: Scan for Obfuscation Patterns
        run: |
          HITS=$(grep -rn --include='*.js' --include='*.mjs' \
            -E '(\\x[0-9a-fA-F]{2}|String\.fromCharCode|unescape\(|atob\(|btoa\()' \
            . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "FAIL: Found $HITS obfuscation patterns"
            grep -rn --include='*.js' --include='*.mjs' \
              -E '(\\x[0-9a-fA-F]{2}|String\.fromCharCode|unescape\(|atob\(|btoa\()' \
              . --exclude-dir=.git --exclude-dir=node_modules
            exit 1
          fi
          echo "PASS: Zero obfuscation patterns detected"

      - name: Scan Markdown for XSS Injection
        run: |
          HITS=$(grep -rn --include='*.md' \
            -E '(<script|<iframe|javascript:|onclick=|onerror=|onload=|data:text/html)' \
            . --exclude-dir=.git 2>/dev/null | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "FAIL: Found $HITS potential XSS patterns in markdown"
            grep -rn --include='*.md' \
              -E '(<script|<iframe|javascript:|onclick=|onerror=|onload=|data:text/html)' \
              . --exclude-dir=.git
            exit 1
          fi
          echo "PASS: Zero XSS patterns in markdown"

      - name: Verify No Secret Material
        run: |
          HITS=$(grep -rn --include='*.js' --include='*.mjs' --include='*.json' --include='*.sh' \
            -iE '(api[_-]?key|secret[_-]?key|private[_-]?key|password|token|AWS_|GITHUB_TOKEN)' \
            . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null | \
            grep -v 'package.json' | grep -v '\.md:' | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "WARNING: Found $HITS potential secret patterns (review manually)"
            grep -rn --include='*.js' --include='*.mjs' --include='*.json' --include='*.sh' \
              -iE '(api[_-]?key|secret[_-]?key|private[_-]?key|password|token|AWS_|GITHUB_TOKEN)' \
              . --exclude-dir=.git --exclude-dir=node_modules | grep -v 'package.json'
          fi
          echo "PASS: No obvious secret material detected"
